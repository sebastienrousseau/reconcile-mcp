[tool.poetry]
name = "reconcile-mcp"
version = "0.0.7"
description = "Model Context Protocol (MCP) server that reconciles ISO 20022 camt.053 bank-statement entries against expected pain.001 payments -- explainable exact, partial, one-to-many and many-to-one matching."
authors = ["Sebastien Rousseau <sebastian.rousseau@gmail.com>"]
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/sebastienrousseau/reconcile-mcp"
homepage = "https://reconcile-mcp.com"
keywords = [
    "iso-20022",
    "reconciliation",
    "camt053",
    "pain001",
    "mcp",
    "payments",
    "treasury",
    "fintech",
]
packages = [
    { include = "reconcile_mcp" },
]

[tool.poetry.scripts]
reconcile-mcp = "reconcile_mcp.server:main"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
# GHSA-84m7-p3x7-pcfv affects mcp >=1.8.0,<1.30.0 and >=2.0.0,<2.2.0; both
# ranges are excluded so no affected release can resolve.
mcp = ">=1.30.0,!=2.0.*,!=2.1.*,<3"
rapidfuzz = ">=3.0,<4"
# scipy powers the many-to-many (subset-sum) ILP solver. It is heavy, so it is
# optional: the tool degrades gracefully when it is absent. Install via the
# "ilp" extra: pip install reconcile-mcp[ilp].
scipy = { version = ">=1.11,<2", optional = true }
# Agent-framework adapters (reconcile_mcp.framework_adapters) wrap the gateway
# tools into each framework's native tool type. The frameworks are heavy and
# conflict-prone, so they are strictly optional and are NOT test or dev
# dependencies; install only the adapter you need via its extra, e.g.
# pip install reconcile-mcp[langchain].
langchain-core = { version = ">=0.2", optional = true }
# crewai requires Python <3.14; without the marker Poetry cannot resolve the
# project (>=3.10,<4.0) at all, which fails the release SBOM job.
# crewai and llama-index-core pull in Pillow (via pdfplumber and
# llama-index-core) and crewai pulls in filelock (via huggingface-hub). Every
# Pillow < 13.0.0 is advised (GHSA, 5 critical) and every filelock <= 4.2.0
# (GHSA-9vhv-jxww-xfm5, GHSA-567q-5qvw-pf92, GHSA-v4x8-3wr5-3wq8); both fixes
# need Python 3.11. So these two extras install from Python 3.11 only, with the
# fixed floors below, and the core package keeps Python 3.10.
crewai = { version = ">=0.51", optional = true, python = ">=3.11,<3.14" }
llama-index-core = { version = ">=0.10", optional = true, python = ">=3.11" }
pillow = { version = ">=13.0.0", optional = true, python = ">=3.11" }
filelock = { version = ">=4.2.1", optional = true, python = ">=3.11" }

# Transitive, via `mcp` -> `pyjwt[crypto]`. Nothing in this tree
# constrains it, so a resolver is free to pick a version in the
# >=44.0.0,<50.0.0 range that GHSA flags as high severity. Floored
# here so the patched line is the only resolvable one; the pins in
# requirements/ already sit at 50.0.0.
cryptography = ">=50.0.0"
[tool.poetry.extras]
ilp = ["scipy"]
langchain = ["langchain-core"]
crewai = ["crewai", "pillow", "filelock"]
llamaindex = ["llama-index-core", "pillow"]

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.3,<10.0.0"
pytest-cov = ">=6.0.0,<8.0.0"
black = "^26.3.1"
ruff = "^0.1.0"
mypy = "^1.11.0"
bandit = "^1.7.0"
# scipy is exercised in the test suite so the real ILP solve path is covered.
scipy = ">=1.11,<2"
# tests/test_suite_conformance.py parses pyproject.toml. tomllib is
# stdlib only from 3.11 and the suite floor is 3.10, so without the
# backport the conformance gate does not run there at all.
tomli = { version = ">=2", python = "<3.11" }
packaging = ">=23"
[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# tests/test_suite_conformance.py is generated and vendored from one
# canonical copy shared across the suite, and checksummed by its own
# test. The suite uses three different line lengths, so letting each
# repository's formatter rewrite it would make the checksum
# unsatisfiable everywhere.
[tool.black]
extend-exclude = "tests/test_suite_conformance\\.py"
line-length = 79
target-version = ['py310']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "-ra",
    "--strict-markers",
    "--tb=short",
    "--cov=reconcile_mcp",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]

[tool.coverage.run]
branch = true
source = ["reconcile_mcp"]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "pragma: no cover",
    "@overload",
]
fail_under = 100
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 79
target-version = "py310"
extend-exclude = ["*.md", "tmp_env", ".venv", ".eggs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/conftest.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
check_untyped_defs = true
strict_equality = true
# Honour per-module follow_imports even for .pyi stubs, so the numpy override
# below can take effect (numpy is pulled in transitively by rapidfuzz's stubs).
follow_imports_for_stubs = true
exclude = [
    "tmp_env/",
    ".venv/",
    ".eggs/",
]

[[tool.mypy.overrides]]
module = "mcp.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Agent frameworks are optional extras, lazily imported by
# framework_adapters.py and not installed in the type-check environment.
module = [
    "langchain_core.*",
    "crewai.*",
    "crewai_tools.*",
    "llama_index.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# numpy (reached transitively via rapidfuzz's stubs, and lazily by the ILP
# solver) ships PEP 695 "type" statements in its stubs that fail to parse under
# python_version 3.10. Skip it and treat it as Any -- we never rely on its
# types.
module = ["numpy", "numpy.*"]
follow_imports = "skip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The server tools return bare JSON-shaped dict/list/str built from loosely
# typed inputs. Relax the two strict checks that signature would trip while
# keeping the rest of strict mode in force.
module = "reconcile_mcp.server"
disallow_any_generics = false
warn_return_any = false
# The server object comes from the SDK-compat shim, so its decorators are
# untyped from mypy's point of view on either major.
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
warn_unused_ignores = false
disable_error_code = ["arg-type", "return-value", "attr-defined", "assignment"]
